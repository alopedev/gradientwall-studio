[build]
  command = "npm run build"
  publish = "dist"

# Routing. Every public page is prerendered at build time (see the seo plugin
# in vite.config.ts), so Netlify serves real files and anything else is a real
# 404 (served from the prerendered 404.html, whose React app then redirects
# the visitor home). Only the post-checkout page has no prerendered file and
# needs the SPA fallback. `public/_redirects` mirrors this block.
# Impasto's URL was /packs/acrylic until October 2026.
[[redirects]]
  from = "/packs/acrylic"
  to = "/packs/impasto/"
  status = 301

[[redirects]]
  from = "/packs/acrylic/*"
  to = "/packs/impasto/:splat"
  status = 301

[[redirects]]
  from = "/packs/:slug/success"
  to = "/index.html"
  status = 200
