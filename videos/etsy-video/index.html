<!DOCTYPE html>
<!--
  Etsy listing video — Dessau (12 Bauhaus wallpapers: 6 phone + 6 desktop). 12 s, 1920×1440 (4:3, like
  the listing photos), silent, loop-safe: first and last frames are the empty
  cream backdrop.

  Three.js draws the 3D scene (procedural iPhone + Studio Display from
  lib/devices.js, wallpapers through the transition shader in lib/screen.js,
  flat Bauhaus shapes behind). Every value is a pure function of time: a private GSAP
  timeline (`stl`) is seeked to the requested time and the scene is drawn from
  its state. The registered timeline (`main`) owns the HTML overlays and
  re-renders the canvas on every seek.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1440">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"
        }
      }
    </script>
    <style>
      @font-face { font-family: "Barlow"; font-weight: 500; src: url("assets/fonts/barlow-500.woff2") format("woff2"); }
      @font-face { font-family: "Barlow"; font-weight: 600; src: url("assets/fonts/barlow-600.woff2") format("woff2"); }
      @font-face { font-family: "Barlow"; font-weight: 700; src: url("assets/fonts/barlow-700.woff2") format("woff2"); }
      @font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; src: url("assets/fonts/instrument-serif-italic.woff2") format("woff2"); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1440px; overflow: hidden; background: #f2eee8; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; color: #161412; font-family: "Barlow", sans-serif; }
      #stage { position: absolute; inset: 0; }
      #gl { width: 100%; height: 100%; display: block; }

      /* Counter while the designs cycle */
      #counter { position: absolute; left: 110px; bottom: 96px; width: 700px; height: 150px; }
      .count-item { position: absolute; left: 0; bottom: 0; display: flex; align-items: baseline; gap: 26px; opacity: 0; }
      .count-num { font-weight: 700; font-size: 64px; letter-spacing: 0.02em; }
            .count-name { font-family: "Instrument Serif", serif; font-style: italic; font-size: 64px; }

      /* End card */
      #endcard { position: absolute; left: 0; right: 0; top: 96px; height: 520px; display: flex; flex-direction: column; align-items: center; gap: 26px; text-align: center; }
      .eyebrow { font-weight: 500; font-size: 30px; letter-spacing: 0.22em; text-transform: uppercase; color: #6f6962; }
      .title { display: flex; font-weight: 700; font-size: 200px; line-height: 0.9; letter-spacing: -0.02em; }
      .title span { display: block; }
      .sub { font-weight: 500; font-size: 62px; line-height: 1; }
      .sub em { font-family: "Instrument Serif", serif; font-weight: 400; }
      .chips { display: flex; gap: 20px; margin-top: 8px; }
      .chip { display: block; border: 3px solid #161412; border-radius: 2px; padding: 14px 28px; font-weight: 600; font-size: 34px; letter-spacing: 0.08em; text-transform: uppercase; }
      .chip.solid { background: #161412; color: #f2eee8; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-xfz3" id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1440">
      <div data-hf-id="hf-zz7x" id="stage" class="clip" data-start="0" data-duration="12" data-track-index="0">
        <canvas data-hf-id="hf-sw8x" id="gl" width="1920" height="1440"></canvas>
      </div>

      <div data-hf-id="hf-cly0" id="counter" data-layout-allow-overlap="" class="clip" data-start="0" data-duration="12" data-track-index="1">
        <div data-hf-id="hf-k8k7" class="count-item"><span data-hf-id="hf-6jz6" class="count-num">01</span><span data-hf-id="hf-u36l" class="count-name">Kreise</span></div>
        <div data-hf-id="hf-aj4n" class="count-item"><span data-hf-id="hf-6ya7" class="count-num">02</span><span data-hf-id="hf-gx5r" class="count-name">Rot</span></div>
        <div data-hf-id="hf-a4tm" class="count-item"><span data-hf-id="hf-7cl8" class="count-num">03</span><span data-hf-id="hf-fms4" class="count-name">Schwarz</span></div>
        <div data-hf-id="hf-9qil" class="count-item"><span data-hf-id="hf-7qw9" class="count-num">04</span><span data-hf-id="hf-33ls" class="count-name">Gelb</span></div>
        <div data-hf-id="hf-cins" class="count-item"><span data-hf-id="hf-857a" class="count-num">05</span><span data-hf-id="hf-hlnn" class="count-name">Sonne</span></div>
        <div data-hf-id="hf-c4cr" class="count-item"><span data-hf-id="hf-8jib" class="count-num">06</span><span data-hf-id="hf-l3hc" class="count-name">Halbkreise</span></div>
      </div>

      <div data-hf-id="hf-ml34" id="endcard" class="clip" data-start="0" data-duration="12" data-track-index="2">
        <div data-hf-id="hf-u3if" class="eyebrow" id="ec-eyebrow">Digital download · Wallpaper pack</div>
        <div data-hf-id="hf-62u9" class="title" id="ec-title"><span data-hf-id="hf-ksn3">D</span><span data-hf-id="hf-xwr0">e</span><span data-hf-id="hf-scgm">s</span><span data-hf-id="hf-kwl6">s</span><span data-hf-id="hf-zhz4">a</span><span data-hf-id="hf-rjuk">u</span></div>
        <div data-hf-id="hf-3dot" class="sub" id="ec-sub">12 Bauhaus <em data-hf-id="hf-rcd4">modern</em> wallpapers</div>
        <div data-hf-id="hf-70yh" class="chips" id="ec-chips"><span data-hf-id="hf-rpwu" class="chip solid">6 × iPhone</span><span data-hf-id="hf-f0re" class="chip solid">6 × Mac · PC</span><span data-hf-id="hf-90n4" class="chip">4K + 5K</span></div>
      </div>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      import { buildPhone, buildMonitor, PHONE, MONITOR } from "./lib/devices.js";
      import { screenMaterial, screenAt, applyScreen } from "./lib/screen.js";

      const W = 1920, H = 1440, DURATION = 12;

      // ── Pack data ────────────────────────────────────────────────────────────
      const PAL = { cobalt: "#1e50c9", vermilion: "#e54128", black: "#161616", mustard: "#f9b522" };
      const IDS = ["01", "02", "03", "04", "05", "06"];
      // A contrasting disc sits behind the phone while each design is on screen.
      const DISC = [PAL.mustard, PAL.cobalt, PAL.vermilion, PAL.cobalt, PAL.black, PAL.vermilion];
      // Light wallpapers get a dark clock, like iOS does.
      const DARK_CLOCK = [false, false, false, true, false, false];
      // Act 1: the phone walks through the six designs.
      const TOUR = [
        { t: 2.0, from: 0, to: 1, mode: 0, origin: [0.0, -0.35], accent: PAL.mustard },
        { t: 3.05, from: 1, to: 2, mode: 1, dir: [0.55, 1.0], accent: PAL.cobalt },
        { t: 4.1, from: 2, to: 3, mode: 2, origin: [0.0, 0.1], accent: PAL.vermilion },
        { t: 5.15, from: 3, to: 4, mode: 0, origin: [1.0, 1.0], accent: PAL.black },
        { t: 6.2, from: 4, to: 5, mode: 1, dir: [-1.0, 0.25], accent: PAL.vermilion },
      ].map((s) => ({ ...s, dur: 0.62 }));
      // Act 2: phone and monitor flip through designs together — every design has
      // its own desktop composition, not a crop.
      const DUO = [
        { t: 9.05, from: 5, to: 1, mode: 0, origin: [0, 0], accent: PAL.mustard },
        { t: 9.45, from: 1, to: 2, mode: 1, dir: [1, 0.3], accent: PAL.cobalt },
        { t: 9.85, from: 2, to: 3, mode: 0, origin: [-1, 1], accent: PAL.vermilion },
        { t: 10.25, from: 3, to: 4, mode: 1, dir: [-0.4, 1], accent: PAL.black },
        { t: 10.65, from: 4, to: 0, mode: 0, origin: [0, -1], accent: PAL.vermilion },
      ].map((s) => ({ ...s, dur: 0.34 }));
      const PHONE_SWAPS = [...TOUR, ...DUO];

      // ── Renderer / scene ─────────────────────────────────────────────────────
      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.VSMShadowMap;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#f2eee8");
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;

      const key = new THREE.DirectionalLight(0xffffff, 2.2);
      key.position.set(-1.4, 2.4, 6);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      Object.assign(key.shadow.camera, { left: -5, right: 5, top: 4, bottom: -4, near: 0.5, far: 20 });
      key.shadow.radius = 14;
      key.shadow.blurSamples = 24;
      key.shadow.bias = -0.0004;
      scene.add(key, new THREE.AmbientLight(0xffffff, 0.25));

      // Shadows land on an invisible sheet just in front of the Bauhaus shapes.
      const shadowSheet = new THREE.Mesh(new THREE.PlaneGeometry(24, 18), new THREE.ShadowMaterial({ opacity: 0.2 }));
      shadowSheet.position.z = -0.9;
      shadowSheet.receiveShadow = true;
      scene.add(shadowSheet);

      const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 50);

      // ── Devices ──────────────────────────────────────────────────────────────
      const clockCanvas = document.createElement("canvas");
      clockCanvas.width = 512; clockCanvas.height = 192;
      const clockTex = new THREE.CanvasTexture(clockCanvas);
      clockTex.colorSpace = THREE.SRGBColorSpace;
      const clockMat = new THREE.MeshBasicMaterial({ map: clockTex, transparent: true, toneMapped: false });
      const phone = buildPhone(screenMaterial(PHONE.sw / PHONE.sh), clockMat);
      const monitor = buildMonitor(screenMaterial(MONITOR.sw / MONITOR.sh));
      scene.add(phone.group, monitor.group);

      // ── Bauhaus backdrop ─────────────────────────────────────────────────────
      const flat = (c) => new THREE.MeshBasicMaterial({ color: c, toneMapped: false, side: THREE.DoubleSide });
      const disc = new THREE.Mesh(new THREE.CircleGeometry(1, 96), flat(DISC[0]));
      disc.position.z = -0.95;
      scene.add(disc);
      const SHAPES = [
        { geo: new THREE.PlaneGeometry(0.018, 4.4), color: PAL.black, pos: [0.25, 0.05, -1.45], rot: 0.62, spin: 0.018 },
        { geo: new THREE.CircleGeometry(0.2, 64), color: PAL.vermilion, pos: [1.3, 0.92, -1.1], rot: 0, spin: 0 },
        { geo: new THREE.PlaneGeometry(0.16, 0.95), color: PAL.mustard, pos: [-1.35, -0.72, -1.2], rot: -0.32, spin: 0.03 },
        { geo: new THREE.CircleGeometry(0.44, 64, 0, Math.PI), color: PAL.cobalt, pos: [1.2, -0.9, -1.6], rot: 0.4, spin: 0.06 },
        { geo: new THREE.CircleGeometry(0.07, 48), color: PAL.black, pos: [-1.08, 0.98, -0.6], rot: 0, spin: 0 },
        { geo: new THREE.RingGeometry(0.27, 0.3, 72), color: PAL.black, pos: [-1.5, 0.22, -1.8], rot: 0, spin: 0 },
      ].map((d) => {
        const m = new THREE.Mesh(d.geo, flat(d.color));
        m.position.set(...d.pos);
        scene.add(m);
        return { mesh: m, ...d, s: 0 };
      });

      // ── State timeline (private, seeked from renderAt) ───────────────────────
      const S = {
        phX: 0, phY: -3.3, phZ: 0, phS: 1, phRX: 0.35, phRY: -2.9, phRZ: 0.2,
        monX: -0.4, monY: -4.6, monZ: -0.75, monRX: 0.35, monRY: 0.22,
        camAz: -0.28, camEl: 0.05, camD: 4.6, tgtX: 0, tgtY: 0,
        disc: 0, discX: -0.38, discY: 0.32, discS: 1,
      };
      const stl = gsap.timeline({ paused: true });
      // Intro — the phone rises back-first and turns to face the lens; shapes pop in.
      stl.to(S, { phY: 0, duration: 1.3, ease: "expo.out" }, 0.1);
      stl.to(S, { phRY: -0.1, phRX: 0.04, phRZ: 0, duration: 1.8, ease: "power2.inOut" }, 0.1);
      stl.to(S, { disc: 1, duration: 1.0, ease: "back.out(1.7)" }, 0.45);
      stl.to(SHAPES, { s: 1, duration: 0.8, ease: "back.out(1.8)", stagger: 0.07 }, 0.6);
      // Slow orbit and push while the designs cycle.
      stl.to(S, { camAz: 0.26, duration: 7.1, ease: "sine.inOut" }, 0);
      stl.to(S, { camD: 4.25, duration: 6.9, ease: "sine.inOut" }, 0.2);
      // Pull back: the monitor rises in behind, the phone steps forward-right.
      stl.to(S, { camD: 8.2, camAz: 0.1, camEl: 0.06, tgtX: 0.35, tgtY: 0.42, duration: 1.9, ease: "power3.inOut" }, 7.1);
      stl.to(S, { phX: 1.02, phY: -0.62, phZ: 0.5, phS: 0.8, phRY: -0.38, phRX: 0.02, duration: 1.7, ease: "power3.inOut" }, 7.2);
      stl.to(S, { monY: -0.28, monRX: 0.02, monRY: 0.1, duration: 1.5, ease: "power3.out" }, 7.55);
      stl.to(S, { discX: 1.55, discY: -0.35, discS: 1.2, duration: 1.8, ease: "power3.inOut" }, 7.2);
      // Line, dot, small disc and ring would crowd the end-card type.
      stl.to([SHAPES[0], SHAPES[1], SHAPES[4], SHAPES[5]], { s: 0, duration: 0.45, ease: "back.in(1.6)" }, 7.3);
      // Exit — back to the empty backdrop so the loop is seamless.
      stl.to(S, { phY: -4.2, phRX: 0.4, duration: 0.6, ease: "power3.in" }, 11.3);
      stl.to(S, { monY: -5.2, monRX: 0.3, duration: 0.62, ease: "power3.in" }, 11.28);
      stl.to(S, { disc: 0, duration: 0.45, ease: "back.in(1.6)" }, 11.4);
      stl.to([SHAPES[2], SHAPES[3]], { s: 0, duration: 0.4, ease: "back.in(1.8)", stagger: 0.03 }, 11.35);
      stl.set({}, {}, DURATION);

      const swapEase = gsap.parseEase("power2.inOut");
      const clamp01 = (v) => Math.min(1, Math.max(0, v));

      // ── Draw ─────────────────────────────────────────────────────────────────
      let tex = null, ready = false, lastTime = 0;

      function drawClock() {
        const c = clockCanvas.getContext("2d");
        c.clearRect(0, 0, 512, 192);
        c.fillStyle = "#ffffff";
        c.font = "500 150px Barlow";
        c.textAlign = "center";
        c.textBaseline = "middle";
        c.fillText("9:41", 256, 100);
        clockTex.needsUpdate = true;
      }

      function renderAt(time) {
        lastTime = time;
        if (!ready) return;
        const t = Math.min(Math.max(time, 0), DURATION);
        stl.time(t);

        camera.position.set(
          S.tgtX + S.camD * Math.sin(S.camAz) * Math.cos(S.camEl),
          S.tgtY + S.camD * Math.sin(S.camEl),
          S.camD * Math.cos(S.camAz) * Math.cos(S.camEl),
        );
        camera.lookAt(S.tgtX, S.tgtY, 0);

        // Phone keeps its face toward the lens and breathes gently.
        const bob = Math.sin(t * 1.7) * 0.025;
        phone.group.position.set(S.phX, S.phY + bob, S.phZ);
        phone.group.rotation.set(S.phRX, S.phRY + S.camAz * 0.6, S.phRZ + Math.sin(t * 1.1) * 0.012);
        phone.group.scale.setScalar(S.phS);
        monitor.group.position.set(S.monX, S.monY, S.monZ);
        monitor.group.rotation.set(S.monRX, S.monRY + S.camAz * 0.3, 0);

        const ps = screenAt(t, 0, PHONE_SWAPS, swapEase);
        applyScreen(phone.screen.material, ps, tex.phone);
        const lastSwap = PHONE_SWAPS.filter((s) => s.t <= t).pop();
        phone.screen.material.uniforms.sheen.value = -0.9 + ((t - (lastSwap?.t ?? 0.4)) / 1.1) * 2.0;
        const shown = ps.p >= 0.5 ? ps.b : ps.a;
        clockMat.color.set(DARK_CLOCK[shown] ? "#161616" : "#ffffff");

        const ms = screenAt(t, 5, DUO, swapEase);
        applyScreen(monitor.screen.material, ms, tex.desk);
        monitor.screen.material.uniforms.sheen.value = -1.2 + clamp01((t - 8.2) / 1.6) * 2.6;

        // Disc: hard colour switch (a blend of two primaries turns muddy), masked
        // by a pulse; it settles on vermilion once the end card is up.
        disc.material.color.set(t > 8.5 ? DISC[5] : DISC[shown]);
        const pulse = ps.swap && t < 8.5 ? Math.sin(ps.p * Math.PI) * 0.09 : 0;
        disc.scale.setScalar(Math.max(0.0001, S.disc * S.discS * (1 + pulse)));
        disc.position.set(S.discX, S.discY, -0.95);

        for (const sh of SHAPES) {
          sh.mesh.scale.setScalar(Math.max(0.0001, sh.s));
          sh.mesh.rotation.z = sh.rot + sh.spin * t;
        }
        renderer.render(scene, camera);
      }

      // ── Build: textures + clock font, then first frame ───────────────────────
      const loader = new THREE.TextureLoader();
      const loadTex = (url) =>
        loader.loadAsync(url).then((t) => {
          t.colorSpace = THREE.SRGBColorSpace;
          t.anisotropy = 8;
          return t;
        });
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["dessau-scene"] = (async () => {
        const font = new FontFace("Barlow", 'url("assets/fonts/barlow-500.woff2")', { weight: "500" });
        const [phoneTex, deskTex] = await Promise.all([
          Promise.all(IDS.map((n) => loadTex(`assets/dessau/phone-${n}.jpg`))),
          Promise.all(IDS.map((n) => loadTex(`assets/dessau/desk-${n}.jpg`))),
          font.load().then((f) => document.fonts.add(f)),
        ]);
        tex = { phone: phoneTex, desk: deskTex };
        drawClock();
        renderer.compile(scene, camera);
        ready = true;
        renderAt(lastTime);
      })();

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));

      // ── Registered timeline: HTML overlays; every seek redraws the canvas ────
      const tl = gsap.timeline({ paused: true, onUpdate: () => renderAt(tl.time()) });
      const items = gsap.utils.toArray(".count-item");
      // Counter: each name appears at the midpoint of the swap that brings its design.
      const shows = [1.35, ...TOUR.map((s) => s.t + s.dur / 2)];
      items.forEach((el, i) => {
        tl.fromTo(el, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, shows[i]);
        const end = i < items.length - 1 ? shows[i + 1] - 0.12 : 7.2;
        tl.to(el, { opacity: 0, y: -18, duration: 0.2, ease: "power2.in" }, end);
      });
      tl.fromTo("#ec-eyebrow", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 8.75);
      tl.fromTo("#ec-title span", { opacity: 0, y: 90 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out", stagger: 0.055 }, 8.85);
      tl.fromTo("#ec-sub", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 9.3);
      tl.fromTo("#ec-chips .chip", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)", stagger: 0.08 }, 9.55);
      tl.to(["#ec-eyebrow", "#ec-title", "#ec-sub", "#ec-chips"], { opacity: 0, y: -30, duration: 0.4, ease: "power2.in", stagger: 0.04 }, 11.2);
      tl.set({}, {}, DURATION);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
