<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Per-page SEO tags (title, description, canonical, robots, Open Graph,
         Twitter, JSON-LD) live between these markers. They are generated from
         src/lib/seo/pages.ts: the Vite plugin in vite.config.ts fills the home
         version here and writes one prerendered HTML per route at build time.
         Don't hand-edit what's between the markers. -->
    <!--seo:start-->
    <!--seo:end-->
    <meta name="theme-color" content="#e3e2de" />
    <meta name="color-scheme" content="light" />

    <!-- Pinterest website claim (business account GradientWall). -->
    <meta name="p:domain_verify" content="8a0460a32543b00ee0d44cdf27c56eea" />

    <!-- Icons + PWA manifest -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Google Search's favicon: raster and larger than 48px (it doesn't list SVG). -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Fonts live in public/fonts/ (@font-face in src/index.css). Preloading the
         latin files lets text paint in the right face without waiting for CSS. -->
    <link rel="preload" href="/fonts/albert-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jost-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
