<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Per-page SEO tags (title, description, canonical, robots, Open Graph,
         Twitter, JSON-LD) live between these markers. They are generated from
         src/lib/seo/pages.ts: the Vite plugin in vite.config.ts fills the home
         version here and writes one prerendered HTML per route at build time.
         Don't hand-edit what's between the markers. -->
    <!--seo:start-->
    <!--seo:end-->
    <meta name="theme-color" content="#e3e2de" />
    <meta name="color-scheme" content="dark" />

    <!-- Icons + PWA manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Fonts: preconnect first (lets the browser open the connection in
         parallel with HTML parsing), then the stylesheet. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400..700&family=Jost:wght@400..600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
