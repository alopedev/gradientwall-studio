<!doctype html>
<!--
  Etsy shop banner ("big banner", 3360×840) rendered by
  scripts/etsy-listing/render-banner.sh. A row of phones mixing every pack,
  no text: the shop name already sits right under the banner. Etsy crops the
  sides on narrow screens, so the strongest pieces go in the middle.
  Reads the exported phone JPGs from etsy-out/<slug>/mobile/.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #f2eee8; --frame: #1b1a19; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 3360px; height: 840px; overflow: hidden; background: var(--bg); font-family: sans-serif; }
  .row { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; gap: 70px; }
  .phone { position: relative; flex: none; width: 300px; aspect-ratio: 1320/2868; border: 14px solid var(--frame); border-radius: 64px; background-size: cover; background-position: center; box-shadow: 0 36px 80px rgba(0,0,0,.28); }
  .phone::after { content: ""; position: absolute; top: 18px; left: 50%; transform: translateX(-50%); width: 30%; height: 32px; border-radius: 22px; background: var(--frame); }
  /* Stagger: every other phone drops so the row reads as a rhythm, not a grid. */
  .phone:nth-child(even) { transform: translateY(60px); }
  .phone:nth-child(odd) { transform: translateY(-40px); }
</style>
</head>
<body>
<div class="row"></div>
<script>
  // Left → right. Alternate packs; the center (4th of 8) is the most recognisable piece.
  const PICKS = [
    "impasto/03", "dessau/04", "impasto/08", "dessau/01",
    "impasto/01", "dessau/02", "impasto/06", "dessau/05",
  ];
  document.querySelector(".row").innerHTML = PICKS.map((p) => {
    const [slug, n] = p.split("/");
    const url = `../../etsy-out/${slug}/mobile/gradientwall-${slug}-${n}-mobile.jpg`;
    return `<div class="phone" style="background-image:url('${url}')"></div>`;
  }).join("");
</script>
</body>
</html>
